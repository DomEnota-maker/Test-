name: VL80S reference-pack QA

on:
  push:
    branches:
      - content/vl80s-knowledge-expansion
    paths:
      - 'docs/reference_packs/vl80s/**'
      - 'qa/validate_vl80s_reference_packs.py'
      - 'qa/normalize_vl80s_reference_pack_metadata.py'
      - 'qa/migrate_vl80s_legacy_runtime_roles.py'
      - '.github/workflows/vl80s-reference-pack-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reference-pack-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: content/vl80s-knowledge-expansion

      - name: Backfill legacy runtime roles
        run: python3 qa/migrate_vl80s_legacy_runtime_roles.py

      - name: Normalize derived metadata
        run: python3 qa/normalize_vl80s_reference_pack_metadata.py

      - name: Validate semantic separation
        run: python3 qa/validate_vl80s_reference_packs.py

      - name: Commit deterministic metadata corrections
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No deterministic metadata corrections required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/reference_packs/vl80s
          git commit -m 'qa: normalize VL80S pack metadata [skip ci]'
          git push origin HEAD:content/vl80s-knowledge-expansion
