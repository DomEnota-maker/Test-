name: TEM2 app integration validation

on:
  push:
    branches: [integration/tem2-app, feature/diagnostic-framework-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Stage 1–4, registry, expanded and projection QA
        run: |
          set -euo pipefail
          python3 qa/validate_tem2_stage1_foundation.py
          python3 app/qa/validate_tem2_stage2.py
          python3 app/qa/validate_tem2_stage3.py
          python3 app/qa/validate_tem2_stage4.py
          python3 qa/validate_locomotive_profile_registry.py
          python3 qa/validate_extended_emergency_stage4_integration.py
          python3 qa/verify_tem2_android_assets.py
          python3 qa/verify_chme3_android_assets.py
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 34
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Prepare disposable Android build tree
        run: |
          set -euo pipefail
          mkdir -p buildsrc
          unzip -q RailBrakeCalculator.zip -d buildsrc
          cp -a patch/. buildsrc/RailBrakeCalculator/
          test -f buildsrc/RailBrakeCalculator/settings.gradle.kts
      - name: Resolve pinned real offline ASR AAR
        run: |
          set -euo pipefail
          mkdir -p buildsrc/RailBrakeCalculator/app/libs
          curl -fL --retry 3 --connect-timeout 20 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar \
            -o buildsrc/RailBrakeCalculator/app/libs/sherpa-onnx.aar
          printf '%s  %s\n' \
            633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96 \
            buildsrc/RailBrakeCalculator/app/libs/sherpa-onnx.aar | sha256sum --check
      - name: Android unit tests, lint and debug build
        working-directory: buildsrc/RailBrakeCalculator
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain
      - name: Decode stable signing key
        working-directory: buildsrc/RailBrakeCalculator
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RAILBRAKE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_B64"
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > release.keystore
          test -s release.keystore
      - name: Build signed release APK
        working-directory: buildsrc/RailBrakeCalculator
        env:
          RAILBRAKE_KEYSTORE_PATH: ${{ github.workspace }}/buildsrc/RailBrakeCalculator/release.keystore
          RAILBRAKE_STORE_PASSWORD: ${{ secrets.RAILBRAKE_STORE_PASSWORD }}
          RAILBRAKE_KEY_ALIAS: ${{ secrets.RAILBRAKE_KEY_ALIAS }}
          RAILBRAKE_KEY_PASSWORD: ${{ secrets.RAILBRAKE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --console=plain
      - name: Verify signed release identity
        run: |
          set -euo pipefail
          APK=buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='ru.railbrake.calculator'"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK" > signed-apksigner.log
          grep -qi 'Signer #1 certificate SHA-256 digest: ea9fe9341a6ba72b585bd7ff82ce29c8fc5b7b59e76b8b134df203eaab8e2788' signed-apksigner.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tem2-integration-qa
          path: |
            buildsrc/RailBrakeCalculator/app/build/reports/tests/testDebugUnitTest/
            buildsrc/RailBrakeCalculator/app/build/reports/lint-results-debug.html
            buildsrc/RailBrakeCalculator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: railbrake-framework-v2-release-signed
          path: buildsrc/RailBrakeCalculator/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  emulator-smoke:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tem2-integration-qa
          path: emulator-input
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS:="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check TEM2 and TEM2U on Android API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          avd-name: tem2-integration-smoke
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: bash "$GITHUB_WORKSPACE/qa/run_tem2_android_smoke_ci.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tem2-emulator-smoke-evidence
          path: qa-evidence/
          if-no-files-found: ignore
